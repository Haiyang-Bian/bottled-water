[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthub-system"
version = "0.1.5"
description = "AgentHub shared runtime, subsystems and local CLI"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
models = ["httpx>=0.27.2", "openai>=1.99.0"]
cli = ["pathspec>=0.12,<2", "httpx>=0.27.2", "openai>=1.99.0", "aiosqlite>=0.22.1", "tomli-w>=1.2", "prompt-toolkit>=3.0", "pywin32>=308; sys_platform == 'win32'"]

[project.scripts]
agenthub = "agent_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
agenthub-system = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3.3", "pytest-asyncio>=0.24.0", "ruff>=0.7.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["live: explicitly configured external provider", "windows: native Windows behavior"]

[tool.ruff]
line-length = 100
target-version = "py311"
